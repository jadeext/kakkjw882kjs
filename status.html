<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Status – Jade</title>
  <meta name="description" content="Real-time service status for Jade.">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <nav class="glass-nav">
    <div class="nav-inner">
      <a class="logo" href="/">
        <span class="logo-icon">J</span>
        <span class="logo-text">Jade</span>
      </a>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/pricing">Pricing</a>
        <a class="active" href="/status">Status</a>
      </div>
    </div>
  </nav>

  <main class="container status">
    <h1 class="section-title">System Status</h1>
    <p class="section-sub">All services are <span class="status-ok">operational</span>.</p>

    <div class="status-list">
      <div class="service">
        <span>API</span>
        <span class="dot-ok"></span>
      </div>
      <div class="service">
        <span>Discord bot</span>
        <span class="dot-ok"></span>
      </div>
      <div class="service">
        <span>CDN</span>
        <span class="dot-ok"></span>
      </div>
    </div>

    <p class="last-updated">Last updated: <span id="ts"></span></p>
  </main>

  <script src="../assets/js/main.js"></script>
</body>
</html>
